<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Abby ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    color: white;
}

.container {
    text-align: center;
    padding: 50px;
    border-radius: 25px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    z-index: 5;
    position: relative;
}

/* Teddy Bear Styling */
.teddy {
    font-size: 80px;
    display: block;
    margin-bottom: 10px;
    animation: bob 3s ease-in-out infinite;
}

@keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

/* Floating Heart Styling */
.heart {
    position: absolute;
    bottom: -100px;
    color: white;
    font-size: 20px;
    user-select: none;
    pointer-events: none;
    animation: floatUp 6s linear forwards;
    opacity: 0.8;
}

@keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
}

button {
    padding: 12px 30px;
    border: none;
    border-radius: 30px;
    font-size: 1.1rem;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

#yesBtn { background: #ff2e63; color: white; }
#noBtn { background: white; color: #ff2e63; position: absolute; }

#musicOverlay {
    position: fixed;
    top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.85);
    display:flex; justify-content:center; align-items:center;
    flex-direction:column; z-index: 100;
}
#musicOverlay button { background:#ff2e63; color:white; font-size:1.2rem; }
</style>
</head>

<body>

<div id="musicOverlay">
    <h2>💖 Tap to start something special 💖</h2>
    <button onclick="startMusic()">Play Music 🎶</button>
</div>

<div class="container">
    <span class="teddy">🧸</span> <h1>Abby ❤️</h1>
    <p>
        You make everything feel better...   
        every moment with you is special.   
        <br><br>
        Will you be my girlfriend?
    </p>

    <button id="yesBtn" onclick="sayYes()">Yes 😍</button>
    <button id="noBtn" onmouseover="moveNo()">No 😅</button>
</div>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("bgMusic");

window.onload = () => {
    music.play().catch(() => {
        document.getElementById("musicOverlay").style.display = "flex";
    });
};

function startMusic() {
    music.play();
    document.getElementById("musicOverlay").style.display = "none";
}

// Function to create continuous hearts
function createHeart() {
    const heart = document.createElement("div");
    heart.innerHTML = "❤️";
    heart.classList.add("heart");
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}

// Start generating hearts every 400ms
setInterval(createHeart, 400);

function sayYes() {
    document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;
    background: linear-gradient(135deg,#ff2e63,#ff7eb3); color:white; text-align:center;">
        <div>
            <span style="font-size:100px;">🧸❤️</span>
            <h1>💖 Abby, you just made me the happiest person alive 💖</h1>
            <p>I promise to make you smile every day 😊</p>
        </div>
    </div>`;
}

function moveNo() {
    let btn = document.getElementById("noBtn");
    let x = Math.random() * (window.innerWidth - 150) - (window.innerWidth / 2 - 75);
    let y = Math.random() * (window.innerHeight - 150) - (window.innerHeight / 2 - 75);
    btn.style.transform = `translate(${x}px, ${y}px)`;
}
</script>

</body>
</html>
